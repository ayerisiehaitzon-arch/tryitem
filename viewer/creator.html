<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tryitem 角色创建器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* 版式：整屏是三维舞台，人站在左边留出的空间里；右侧一列捏人面板（手机上变成底部抽屉）。和家具陈列室同一套颜色和字体 */
  :root {
    --stage: #dedcd6;
    --panel: rgba(246, 245, 241, 0.92);
    --panel-solid: #f6f5f1;
    --ink: #1b1e21;
    --muted: #62676c;
    --line: #cbc9c2;
    --track: #d7d5ce;
    --accent: #2446a8;
    --accent-soft: rgba(36, 70, 168, 0.12);
    --on-accent: #ffffff;
    --scrim: rgba(10, 12, 16, 0.35);
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --panel-w: 380px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --stage: #17191c;
      --panel: rgba(31, 34, 38, 0.92);
      --panel-solid: #1f2226;
      --ink: #ebe9e4;
      --muted: #9da2a8;
      --line: #353a40;
      --track: #3a3f45;
      --accent: #8ea6ff;
      --accent-soft: rgba(142, 166, 255, 0.16);
      --on-accent: #0d1430;
      --scrim: rgba(0, 0, 0, 0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --stage: #17191c;
    --panel: rgba(31, 34, 38, 0.92);
    --panel-solid: #1f2226;
    --ink: #ebe9e4;
    --muted: #9da2a8;
    --line: #353a40;
    --track: #3a3f45;
    --accent: #8ea6ff;
    --accent-soft: rgba(142, 166, 255, 0.16);
    --on-accent: #0d1430;
    --scrim: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0; background: var(--stage); color: var(--ink);
    font: 14px/1.5 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button, input, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .head {
    position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px;
    right: calc(var(--panel-w) + 32px); display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .head > * { pointer-events: auto; }
  .head h1 { margin: 0; font: 600 clamp(24px, 3.4vw, 34px)/1.1 var(--serif); letter-spacing: .02em; text-wrap: balance; }
  .head .en { font: 500 11px/1.4 var(--mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
  .name {
    align-self: flex-start; margin-top: 4px; display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .name span { font: 600 10.5px/1 var(--mono); letter-spacing: .12em; color: var(--muted); }
  .name input { width: 9.5em; border: 0; background: transparent; padding: 3px 4px; font: 600 15px/1.2 var(--serif); }

  .panel {
    position: fixed; z-index: 3; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; bottom: 12px; width: var(--panel-w);
    display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); overflow: hidden;
  }
  .tabs { display: flex; gap: 2px; padding: 8px 8px 0; overflow-x: auto; scrollbar-width: none; flex: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; border: 0; background: transparent; cursor: pointer; padding: 8px 10px 10px; border-radius: 8px 8px 0 0;
    font: 600 14px/1 var(--sans); color: var(--muted); border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .sub { display: flex; gap: 6px; padding: 10px 14px 0; flex-wrap: wrap; flex: none; }
  .sub:empty { display: none; }
  .pane { flex: 1; overflow-y: auto; padding: 6px 16px 18px; border-top: 1px solid var(--line); scrollbar-width: thin; }
  .group { padding: 12px 0 4px; display: grid; gap: 10px; }
  .group + .group { border-top: 1px dashed var(--line); }
  .group h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 12px/1 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
  .group h3 em { font-style: normal; font-weight: 400; letter-spacing: 0; text-transform: none; font-family: var(--sans); font-size: 12px; }

  .slider { display: grid; grid-template-columns: 5.4em minmax(0, 1fr) 3.4em; align-items: center; gap: 10px; }
  .slider label { font-size: 13px; white-space: nowrap; cursor: default; overflow: hidden; text-overflow: ellipsis; }
  .slider output { font: 12px/1 var(--mono); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .slider .ends { grid-column: 2; display: flex; justify-content: space-between; margin-top: -8px; font-size: 11px; color: var(--muted); }
  input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; --a: 50%; --b: 50%; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent var(--a), var(--accent) var(--a), var(--accent) var(--b), transparent var(--b)), var(--track); }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent var(--a), var(--accent) var(--a), var(--accent) var(--b), transparent var(--b)), var(--track); }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--panel-solid); border: 2px solid var(--accent); }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--panel-solid); border: 2px solid var(--accent); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px; line-height: 1.2; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip .dot { display: inline-block; width: 12px; height: 12px; margin: 0 6px 0 -3px; vertical-align: -2px; border-radius: 50%; background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); box-shadow: 0 0 0 1px var(--line); }
  .swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .sw { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer; padding: 0; background: var(--c); }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px var(--accent); }
  .sw.none { background: linear-gradient(135deg, transparent 45%, var(--muted) 45%, var(--muted) 55%, transparent 55%), var(--panel-solid); }
  .sw.none.orig { background: var(--c); color: #fff; font-size: 11px; line-height: 24px; text-shadow: 0 0 2px #000, 0 0 1px #000; }
  .sw.custom { position: relative; overflow: hidden; background: conic-gradient(#e55, #ec5, #5c6, #5be, #75e, #e5b, #e55); }
  .sw.custom input { position: absolute; inset: -8px; width: 44px; height: 44px; opacity: 0; cursor: pointer; }

  .parents { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .parent { display: grid; justify-items: center; gap: 4px; padding: 6px 2px 7px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; min-width: 0; font-size: 12px; }
  .parent canvas { width: 100%; max-width: 74px; aspect-ratio: 1; border-radius: 8px; background: var(--track); display: block; }
  .parent[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: transparent; cursor: pointer; min-width: 0; }
  .card b { font: 600 15px/1.3 var(--serif); }
  .card span { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--panel-solid); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .saved { display: grid; gap: 8px; }
  .saved .item { display: flex; align-items: center; gap: 6px; }
  .saved .item .card { flex: 1; }
  .saved .del { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 8px; }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .hint a { color: inherit; }

  .actions {
    position: fixed; z-index: 2; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-wrap: wrap; gap: 8px;
    max-width: calc(100% - var(--panel-w) - 48px);
  }
  .actions button {
    border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 13.5px;
  }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .stats { position: fixed; z-index: 1; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); font: 11px/1.6 var(--mono); color: var(--muted); letter-spacing: .04em; pointer-events: none; font-variant-numeric: tabular-nums; }

  .modal { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: var(--scrim); padding-inline: 16px; }
  .modal .box { width: min(480px, 100%); box-sizing: border-box; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
  .modal h2 { margin: 0; font: 600 20px/1.2 var(--serif); }
  .modal textarea { width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 9px; padding: 10px; background: var(--stage); font: 12px/1.5 var(--mono); word-break: break-all; }
  .toast { position: fixed; z-index: 11; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-50%); background: var(--ink); color: var(--panel-solid); padding: 9px 16px; border-radius: 999px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 12px var(--mono); color: var(--muted); letter-spacing: .12em; pointer-events: none; text-align: center; }

  @media (max-width: 760px) {
    :root { --panel-w: 100%; --sheet: 46%; }
    .head { right: 16px; }
    .head h1 { font-size: 22px; }
    .name { display: none; }
    .panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: var(--sheet); border-radius: 16px 16px 0 0; border-width: 1px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .actions { left: 16px; right: 16px; max-width: none; bottom: calc(var(--sheet) + 10px); gap: 6px; }
    .actions button { padding: 7px 11px; font-size: 13px; }
    .stats { display: none; }
    .parents { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  body.shot .actions, body.shot .stats, body.shot .loading { display: none; }
  body.bare .head, body.bare .panel { display: none; }
</style>

<canvas id="stage" aria-label="三维角色预览，可拖动旋转、滚轮或双指缩放"></canvas>
<div class="loading" id="loading">LOADING<br><span id="loading-sub"></span></div>
<header class="head">
  <h1>角色创建器</h1>
  <div class="en">Character creator · tryitem</div>
  <label class="name"><span>NAME</span><input id="name" maxlength="16" value="未命名角色" aria-label="角色名字"></label>
</header>
<aside class="panel" aria-label="捏人面板">
  <nav class="tabs" id="tabs" role="tablist" aria-label="分类"></nav>
  <div class="sub" id="sub" role="tablist" aria-label="细分"></div>
  <div class="pane" id="pane"></div>
</aside>
<div class="stats" id="stats"></div>
<div class="actions" role="toolbar" aria-label="操作">
  <button id="a-random" class="primary">随机</button>
  <button id="a-reset">重置</button>
  <button id="a-code">捏脸码</button>
  <button id="a-shot">截图</button>
  <button id="a-export">导出模型</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as HM from '../src/human/human.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const SHOT = params.has('shot');
if (SHOT) document.body.classList.add('shot');
if (params.get('bare') === '1') document.body.classList.add('bare');
const ASSETS = params.get('assets') ?? new URL('./human/', location.href).href;

// —— 资源：MakeHuman（CC0）的人体、头发、衣服、皮肤；Quaternius（CC0）的动作 ——
// 数据文件的后缀：仓库里是 gzip 的 .bin；只认常见文件类型的托管上换成 base64 的 .bin.txt（bin=.txt）
const BIN = params.get('bin') ?? '';
const H = await HM.loadHuman(ASSETS, { suffix: BIN });
// 文件数有上限的托管上，每个代理（一款头发、一件衣服……）的网格和贴图打成一个包（scripts/human/pack.mjs），
// 清单（packs=packs.json）记着每个文件在哪个包的哪一段；没有清单就照常一个文件一个文件地读
const PACK_INDEX = params.get('packs') ?? '';
const PACKS = PACK_INDEX ? await (await fetch(ASSETS + PACK_INDEX)).json() : null;
const packCache = new Map();
function packed(path) {
  const e = PACKS?.files[path];
  if (!e) return null;
  if (!packCache.has(e[0])) packCache.set(e[0], fetch(ASSETS + e[0]).then((r) => { if (!r.ok) throw new Error(`${e[0]}: ${r.status}`); return r.text(); }).then((t) => HM.fromBase64(t.trim())));
  return packCache.get(e[0]).then((buf) => buf.subarray(e[1], e[1] + e[2]));
}
if (PACKS) H.loadBin = async (path) => { const b = packed(path); return b ? HM.unzipBin(await b) : HM.fetchBin(ASSETS + path + BIN); };
const ANIM = await (async () => {
  const meta = await (await fetch(`${ASSETS}anims.json`)).json();
  const buf = await HM.fetchBin(`${ASSETS}anims.bin${BIN}`);
  for (const c of meta.clips) { c.qd = new Int16Array(buf, c.q.off, c.q.n); c.hd = new Float32Array(buf, c.hips.off, c.hips.n); }
  return meta;
})();
const CLIPS = Object.fromEntries(ANIM.clips.map((c) => [c.id, c]));

// —— 遗传：GTA 式的“父母”。每位家长 = 人种比例 + 一组脸部滑杆 + 皮肤（人种、第几套）。孩子的脸在两位之间插值，肤色单独插值 ——
const M = (o) => o; // 只是为了排版
const PARENTS = {
  mom: [
    { name: '林晓', race: { asian: 1 }, skin: 'asian', face: M({ 'eyes/eye-epicanthus|in-out': 0.35, 'head/head-oval': 0.5, 'chin/chin-width|decr-incr': -0.25, 'nose/nose-scale-horiz|decr-incr': -0.1, 'mouth/mouth-scale-horiz|decr-incr': -0.15 }) },
    { name: '苏菲', race: { caucasian: 1 }, skin: 'caucasian', face: M({ 'cheek/cheek-bones|decr-incr': 0.35, 'nose/nose-point-width|decr-incr': -0.3, 'head/head-oval': 0.4, 'mouth/mouth-upperlip-volume|decr-incr': 0.25, 'eyes/eye-scale|decr-incr': 0.1 }) },
    { name: '阿玛拉', race: { african: 1 }, skin: 'african', face: M({ 'nose/nose-scale-horiz|decr-incr': 0.25, 'mouth/mouth-lowerlip-volume|decr-incr': 0.35, 'mouth/mouth-upperlip-volume|decr-incr': 0.3, 'head/head-round': 0.3, 'cheek/cheek-bones|decr-incr': 0.2 }) },
    { name: '玛丽亚', race: { caucasian: 0.65, african: 0.2, asian: 0.15 }, skin: 'caucasian2', face: M({ 'eyes/eye-scale|decr-incr': 0.25, 'mouth/mouth-scale-horiz|decr-incr': 0.15, 'chin/chin-prominent|decr-incr': -0.2, 'head/head-invertedtriangular': 0.35, 'eyebrows/eyebrows-angle|down-up': 0.2 }) },
    { name: '优子', race: { asian: 1 }, skin: 'asian', face: M({ 'head/head-round': 0.5, 'eyes/eye-scale|decr-incr': 0.15, 'nose/nose-scale-depth|decr-incr': -0.25, 'chin/chin-height|decr-incr': -0.25, 'cheek/cheek-volume|decr-incr': 0.25 }) },
    { name: '艾琳', race: { caucasian: 1 }, skin: 'caucasian2', face: M({ 'head/head-rectangular': 0.35, 'nose/nose-hump|decr-incr': 0.35, 'nose/nose-scale-vert|decr-incr': 0.2, 'chin/chin-prominent|decr-incr': 0.2, 'eyes/eye-scale|decr-incr': -0.1 }) },
    { name: '莱拉', race: { caucasian: 0.55, asian: 0.25, african: 0.2 }, skin: 'caucasian', face: M({ 'eyebrows/eyebrows-trans|down-up': -0.2, 'nose/nose-curve|concave-convex': 0.35, 'eyes/eye-scale|decr-incr': 0.25, 'head/head-oval': 0.3, 'mouth/mouth-lowerlip-volume|decr-incr': 0.2 }) },
    { name: '珍', race: { african: 0.6, caucasian: 0.4 }, skin: 'african', face: M({ 'cheek/cheek-bones|decr-incr': 0.4, 'head/head-oval': 0.45, 'nose/nose-point-width|decr-incr': -0.1, 'eyes/eye-corner1|down-up': 0.25 }) },
  ],
  dad: [
    { name: '陈峰', race: { asian: 1 }, skin: 'asian', face: M({ 'head/head-square': 0.35, 'chin/chin-width|decr-incr': 0.25, 'eyes/eye-epicanthus|in-out': 0.3, 'nose/nose-scale-depth|decr-incr': -0.1 }) },
    { name: '杰克', race: { caucasian: 1 }, skin: 'caucasian', face: M({ 'chin/chin-prominent|decr-incr': 0.3, 'chin/chin-width|decr-incr': 0.3, 'nose/nose-hump|decr-incr': 0.2, 'head/head-rectangular': 0.35, 'eyebrows/eyebrows-trans|backward-forward': 0.3 }) },
    { name: '科菲', race: { african: 1 }, skin: 'african', face: M({ 'nose/nose-scale-horiz|decr-incr': 0.35, 'mouth/mouth-lowerlip-volume|decr-incr': 0.3, 'head/head-square': 0.25, 'chin/chin-bones|decr-incr': 0.2 }) },
    { name: '卡洛斯', race: { caucasian: 0.6, african: 0.25, asian: 0.15 }, skin: 'caucasian2', face: M({ 'eyebrows/eyebrows-trans|down-up': -0.2, 'nose/nose-curve|concave-convex': 0.3, 'chin/chin-cleft|decr-incr': 0.4, 'head/head-square': 0.2 }) },
    { name: '健太', race: { asian: 1 }, skin: 'asian', face: M({ 'head/head-oval': 0.45, 'eyes/eye-scale|decr-incr': -0.1, 'nose/nose-scale-depth|decr-incr': -0.2, 'mouth/mouth-scale-horiz|decr-incr': -0.1 }) },
    { name: '伊万', race: { caucasian: 1 }, skin: 'caucasian2', face: M({ 'head/head-diamond': 0.35, 'cheek/cheek-bones|decr-incr': 0.45, 'eyes/eye-trans|in-out': -0.15, 'nose/nose-scale-vert|decr-incr': 0.3 }) },
    { name: '奥马尔', race: { caucasian: 0.5, asian: 0.25, african: 0.25 }, skin: 'caucasian', face: M({ 'nose/nose-hump|decr-incr': 0.45, 'eyebrows/eyebrows-trans|backward-forward': 0.35, 'head/head-rectangular': 0.25, 'eyes/eye-scale|decr-incr': 0.1 }) },
    { name: '马库斯', race: { african: 0.7, caucasian: 0.3 }, skin: 'african', face: M({ 'head/head-square': 0.45, 'chin/chin-bones|decr-incr': 0.35, 'mouth/mouth-scale-horiz|decr-incr': 0.2, 'neck/neck-scale-horiz|decr-incr': 0.2 }) },

// —— 捡箱子：腰往前弯、两条胳膊伸到箱子两侧 ——
const Y_AXIS = new THREE.Vector3(0, 1, 0), qT = new THREE.Quaternion(), qP = new THREE.Quaternion();

function bendSpine(deg) {

  const axis = new THREE.Vector3(1, 0, 0).applyAxisAngle(Y_AXIS, rig.rotation.y);

// 两节骨头（上臂、前臂）的 IK：手腕送到 target，手肘往身体外侧、往后撑开；w 是权重（目标从手腕现在的位置往 target 挪 w），
// 够不着就把胳膊伸直指着它
function reachArm(side, target, w) {

  const S = ua.getWorldPosition(new THREE.Vector3()), E = la.getWorldPosition(new THREE.Vector3()), W = hd.getWorldPosition(new THREE.Vector3());
  const a = S.distanceTo(E), b = E.distanceTo(W), T = W.clone().lerp(target, w), dir = T.clone().sub(S);
  const d = Math.min(a + b - 1e-4, Math.max(Math.abs(a - b) + 1e-4, dir.length()));

  const pole = E.clone().sub(S).addScaledVector(out, 0.3);

// 箱子中心在哪（人的大小按胯高缩放，跟道具一样以胯高 0.92m 的阿哲为准）：lift 0 在地上；到 0.5 是原地竖着抬到跪着的那条大腿上方；
// 到 1 是抱在身前——相对胯骨定（往前 0.38m、往上 0.08m），人站起来、跪下去箱子跟着一起升降，不会先飞到脸前面

let lookClip = ''; // 转头看镜头按哪个动作算：动作演示按正在播的那一段

// —— 头看镜头：动作库的待机是给大头卡通角色做的，低着头（脸朝下 12° 左右）；捏人的时候让脖子和头往镜头那边转一些，
//    像 GTA 的创建器那样看着你。只在待机、说话、坐、蹲这些安静的动作里做，换到动作大的片段时慢慢放开 ——

  const chest = bones[BI.spine_03].getWorldQuaternion(new THREE.Quaternion()), chestInv = chest.clone().invert();
  // 在胸口的坐标系里算：脸现在朝哪、镜头在哪。左右最多转 34°，上下 -26° ~ +20°；镜头转到身后就不转了

// —— 眼睛看镜头 ——
const gaze = new THREE.Vector2();
function eyeLook() {
  const headB = bones[BI.head];

    const wp = new THREE.Vector3().setFromMatrixPosition(e.matrixWorld);

// —— 表情：当前表情的单元权重平滑过渡，叠加眨眼 ——

// —— 皮肤、发色、化妆 ——
const maskTex = tex('tex/facemask.webp', false).catch(() => null);

}
// 胡子（胡茬和 3D 的胡须、小胡子）的颜色：选了就用选的，不然跟着发色——染了发用染的颜色，没染用这款头发贴图本来的颜色，光头用深棕

// 衣服、鞋、帽子的配色 → 着色器
function applyColors() {

    const s = SLOTS[slot];
    if (!s) continue;
    const cols = S.colors[s.id] ?? [];
    for (const m of s.meshes) {
      const u = PART_U.get(m.material);
      if (!u) continue;
      u.uPartCol.value.forEach((v, i) => {
        if (cols[i]) { const c = new THREE.Color(cols[i]); v.set(c.r, c.g, c.b, 1); } else v.set(0, 0, 0, 0);
      });

function setColor(id, i, c) {

// 主色（线性）→ 网页颜色，给“原色”那一格用
const domCss = (d) => `#${new THREE.Color().setRGB(d[0], d[1], d[2], THREE.LinearSRGBColorSpace).getHexString()}`;

// 皮料是女款平底鞋，女款皮鞋按平底鞋配。鞋面和本来的颜色差不多（ΔE < 15）、鞋底也差不多（< 30）的方案不列：
// 黑皮鞋没有“黑色”，白网球鞋没有“纯白”（袜子不算，只换袜子不算一套新配色）
function shoeWays(id) {
  const px = H.proxies[id], parts = px?.parts;
  if (!id.startsWith('shoes/') || !parts?.length) return [];
  const kind = parts[0].label === '靴面' ? 'boot' : parts[0].kind === 'sneaker' ? (parts.length > 1 ? 'sneaker' : 'sandal') : px.sex === 'f' || parts.length === 1 ? 'flat' : 'leather';
  const sole = parts.find((p) => p.kind === 'sole');
  return SHOE_WAYS[kind].filter(([, up, so = up]) => deltaE(up, parts[0].dom) >= 15 || (sole && deltaE(so, sole.dom) >= 30))

// —— 换装：按当前状态加载各个槽位 ——

  if (paused) return;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (camAnim) {
    const k = Math.min(1, (now - camAnim.t0) / 650), e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
    controls.target.lerpVectors(camAnim.from[0], camAnim.to[0], e);
    camera.position.lerpVectors(camAnim.from[1], camAnim.to[1], e);
    if (k >= 1) camAnim = null;
  }
  controls.update();
  if (dirty.shape) { dirty.shape = false; updateShape(); }
  if (hiddenDirty) updateHidden();
  if (dirty.skin) updateSkin();
  // 眨眼：每 3~6 秒一次，160ms
  if (!SHOT && S.expr !== 'sleep') {
    if (!blinkStart && now > nextBlink) blinkStart = now;
    if (blinkStart) {
      const k = (now - blinkStart) / 160;
      blink = k < 1 ? Math.sin(Math.PI * k) : 0;
      if (k >= 1) { blinkStart = 0; nextBlink = now + 2800 + Math.random() * 3200; }
    }
  }
  applyAnim(now);
  gridMat.opacity += (gridWant * 0.5 - gridMat.opacity) * Math.min(1, dt * 3);
  grid.visible = gridMat.opacity > 0.004;
  applyExpr(dt);
  headLook(dt);
  rig.updateMatrixWorld(true);
  eyeLook();
  clothStep(dt);
  renderer.render(scene, camera);
  if (now - statsT > 500) { statsT = now; updateStats(); }
}
// 调试：hidemesh=body,outfit 把这些网格藏起来
if (params.has('hidemesh')) { const hide = params.get('hidemesh').split(','); rig.traverse((o) => { if (o.isMesh && hide.includes(o.name)) o.visible = false; }); }
if (SHOT) {
  // 截图：等家长头像都画完（它们会临时改动画面），再画最后一帧
  const final = () => {
    if (!portraits.idle() || paused) { setTimeout(final, 50); return; }
    if (dirty.shape) { dirty.shape = false; updateShape(); }
    if (hiddenDirty) updateHidden();
    Promise.all([updateSkin(), propReady]).then(() => {
      clothPresim(Number(params.get('t') ?? 0));
      applyAnim(performance.now()); applyExpr(1); rig.updateMatrixWorld(true); eyeLook(); rig.updateMatrixWorld(true);
      gridMat.opacity = gridWant * 0.5; grid.visible = gridWant > 0;
      focus(params.get('cam') ?? tabFocus(), true);
      if (params.has('az')) {
        const t = controls.target, d = camera.position.distanceTo(t), a = Number(params.get('az')) * Math.PI / 180, e = Number(params.get('el') ?? 4) * Math.PI / 180;
        camera.position.set(t.x + d * Math.sin(a) * Math.cos(e), t.y + d * Math.sin(e), t.z + d * Math.cos(a) * Math.cos(e));
        controls.update();
      }
      headLook(1); rig.updateMatrixWorld(true); eyeLook(); rig.updateMatrixWorld(true);
      clothStep(CLOTH_DT);
      renderer.render(scene, camera);
      setTimeout(() => { renderer.render(scene, camera); window.__ready = true; }, 80);
    });
  };
  setTimeout(final, 100);
} else renderer.setAnimationLoop(step);
</script>
